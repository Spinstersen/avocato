<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>AVOCATO Learn — Vault de formation juridique</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="styles.css">
<script>try{var t=JSON.parse(localStorage.getItem('avocato:theme'));if(t)addEventListener('DOMContentLoaded',function(){document.body.dataset.theme=t;});}catch(e){}</script>
</head>
<body data-theme="system" data-font="md" data-app="learn">
<div id="readProgress" aria-hidden="true"></div>
<div class="app">

  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark">🎓</span>
        <div>
          <strong>AVOCATO&nbsp;LEARN</strong>
          <span class="brand-sub">Vault de formation · FR/EN/AR</span>
        </div>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Fermer la navigation">✕</button>
    </div>

    <label class="search-wrap" id="searchWrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="Rechercher dans 698 docs…" autocomplete="off">
      <span class="search-key">/</span>
    </label>

    <nav style="padding:0 8px 4px;display:flex;flex-wrap:wrap;gap:4px;" id="domainFilter">
      <button class="df-chip" data-df="all">Tout</button>
    </nav>

    <nav class="curriculum-path" id="pathChips" aria-label="Parcours curriculum"></nav>

    <nav class="tree" id="tree" aria-label="Documents"></nav>

    <div class="sidebar-foot">
      <button class="btn btn-block" id="btnDeadlines" title="Rappels PLF, IGOC, veille, transitions">⏰ Échéances légales</button>
      <a class="btn crosslink" href="cabinet.html" title="Ouvrir la gestion du cabinet">
        <span>⚖️ Cabinet OS</span><span aria-hidden="true">→</span>
      </a>
      <div class="build-hint">Progression sauvegardée localement (offline)</div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main">
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Ouvrir la navigation">☰</button>
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="prevBtn" title="Leçon précédente [ [" aria-label="Document précédent">←</button>
        <button class="icon-btn" id="nextBtn" title="Leçon suivante ] ]" aria-label="Document suivant">→</button>
        <button class="icon-btn" id="readBtn" title="Marquer lu ( l )" aria-label="Marquer comme lu">✓</button>
        <button class="icon-btn" id="printBtn" title="Imprimer / PDF ( p )" aria-label="Imprimer">🖨</button>
        <button class="icon-btn" id="fontDec" title="Réduire la police" aria-label="Réduire la police">A−</button>
        <button class="icon-btn" id="fontInc" title="Augmenter la police" aria-label="Agrandir la police">A+</button>
        <button class="icon-btn" id="themeBtn" title="Thème : clair / sombre / système ( d )" aria-label="Changer de thème">🌙</button>
      </div>
    </header>

    <article class="content-wrap" id="content"></article>
  </main>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<script src="data.js"></script>
<script src="glossary.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
