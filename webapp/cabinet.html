<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<title>Cabinet OS — Gestion du cabinet (offline)</title>
<link rel="stylesheet" href="styles.css">
<script>try{var t=JSON.parse(localStorage.getItem('avocato:theme'));if(t)addEventListener('DOMContentLoaded',function(){document.body.dataset.theme=t;});}catch(e){}</script>
</head>
<body data-theme="system" data-app="cabinet">
<div class="app">

  <aside class="sidebar" id="sidebar" aria-label="Navigation Cabinet">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark">⚖️</span>
        <div>
          <strong>CABINET&nbsp;OS</strong>
          <span class="brand-sub">Dossiers · Conventions · Factures</span>
        </div>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Fermer la navigation">✕</button>
    </div>

    <nav class="cabinet-nav" id="cabinetNav" style="padding:0 8px">
      <button class="cab-nav-item active" data-view="dashboard">📊 Tableau de bord</button>
      <button class="cab-nav-item" data-view="dossiers">📁 Dossiers</button>
      <button class="cab-nav-item" data-view="conventions">📝 Conventions</button>
      <button class="cab-nav-item" data-view="factures">💳 Factures &amp; Provisions</button>
      <button class="cab-nav-item" data-view="echeances">⏰ Échéances</button>
      <button class="cab-nav-item" data-view="bibliotheque">📚 Bibliothèque</button>
      <hr class="cab-sep">
      <button class="cab-nav-item" data-view="new-dossier">＋ Nouveau dossier</button>
    </nav>

    <div class="sidebar-foot">
      <a class="btn crosslink" href="index.html" title="Retour à la formation">
        <span>🎓 AVOCATO Learn</span><span aria-hidden="true">→</span>
      </a>
      <div class="build-hint">Données en localStorage — 100% offline, art. 36 secret professionnel</div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main">
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Ouvrir la navigation">☰</button>
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeBtn" title="Thème : clair / sombre" aria-label="Changer de thème">🌙</button>
      </div>
    </header>

    <article class="content-wrap" id="content"></article>
  </main>
</div>

<!-- Dialogues -->
<dialog id="dlgDossier" class="dlg">
  <form method="dialog" id="formDossier">
    <h3 id="dlgDossierTitle">Nouveau dossier</h3>
    <div class="form-grid">
      <label>Client / Société *<input name="client" required placeholder="Ex: SARL Atlas - M. Alami"></label>
      <label>ICE (si société)<input name="ice" placeholder="ICE 15 chiffres"></label>
      <label>Type *<select name="type" required>
        <option value="">— Choisir —</option>
        <option>Freelance / Agence offshore</option>
        <option>E-commerce / YouCan</option>
        <option>Loi 09-08 / PME</option>
        <option>Créateur / Infopreneur</option>
        <option>MRE / Investisseur</option>
        <option>AE → SARL</option>
        <option>Autre</option>
      </select></label>
      <label>Mission *<select name="mission" required>
        <option value="">— Choisir —</option>
        <option>Diagnostic (600-900 DH HT)</option>
        <option>Mission Contrats - Essentielle (2.500-5.000 DH HT)</option>
        <option>Mission Conformité e-commerce (3.500-6.000 DH HT)</option>
        <option>Mission Loi 09-08 (12.000-28.000 DH HT)</option>
        <option>Mission Création/Structuration (5.000-8.000 DH HT)</option>
        <option>Abonnement - Secrétariat juridique (2.500-6.000 DH HT/mois)</option>
      </select></label>
      <label>Honoraires HT (DH) *<input name="honoraires" type="number" min="0" required placeholder="2900"></label>
      <label>TVA
        <select name="tva"><option value="20">20% (assujetti)</option><option value="0">0% (non assujetti, art. 91 CGI)</option></select>
      </label>
      <label>Provision %<input name="provisionPct" type="number" min="0" max="100" value="50"></label>
      <label>Statut<select name="statut">
        <option>Prospect</option>
        <option>Convention envoyée</option>
        <option>Convention signée</option>
        <option>En cours</option>
        <option>Livré - solde dû</option>
        <option>Clôturé</option>
        <option>Abandonné</option>
      </select></label>
      <label>Échéance prévisionnelle<input name="echeance" type="date"></label>
      <label>Contact (tél/WhatsApp)<input name="contact" placeholder="06 XX XX XX XX"></label>
      <label class="span-2">Notes<textarea name="notes" rows="2" placeholder="Source: comptable X, diagnostic du JJ/MM, risques identifiés..."></textarea></label>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn" id="btnCancelDossier">Annuler</button>
      <button type="submit" class="btn btn-primary">Enregistrer dossier</button>
    </div>
  </form>
</dialog>

<dialog id="dlgEcheance" class="dlg">
  <form method="dialog" id="formEcheance">
    <h3>Nouvelle échéance</h3>
    <div class="form-grid">
      <label>Dossier<select name="dossierId" id="echeanceDossierSel"></select></label>
      <label>Date *<input name="date" type="date" required></label>
      <label>Type<select name="type">
        <option>Remise livrables</option>
        <option>Relance provision</option>
        <option>Relance solde</option>
        <option>Dépôt CNDP/OMPIC/CRI</option>
        <option>AG / Formalité</option>
        <option>Renouvellement abonnement</option>
        <option>Autre</option>
      </select></label>
      <label class="span-2">Intitulé *<input name="intitule" required placeholder="Ex: Remise V1 contrat + Loom"></label>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn" id="btnCancelEcheance">Annuler</button>
      <button type="submit" class="btn btn-primary">Ajouter</button>
    </div>
  </form>
</dialog>

<!-- Zone impression conventions / factures -->
<div id="printArea" hidden></div>

<script src="vendor/chart.umd.min.js"></script>
<script src="data.js"></script>
<script src="cabinet.js"></script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
